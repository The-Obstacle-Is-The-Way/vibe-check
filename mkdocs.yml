# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: vibe-check
repo_url: https://github.com/The-Obstacle-Is-The-Way/vibe-check
site_url: https://the-obstacle-is-the-way.github.io/vibe-check/
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - content.action.view
    - navigation.tracking
    - navigation.sections
    - navigation.footer
    - navigation.instant
    - navigation.indexes
    - toc.follow

plugins:
  - search

# Hide internal/archived pages from nav (still built, just not shown)
not_in_nav: |
  _archive/**
  _specs/**
  _bugs/**
  _brainstorming/**

# Link validation (use with `mkdocs build --strict` in CI)
# Note: Archive docs have stale internal links - these are historical and preserved for provenance
validation:
  omitted_files: warn
  absolute_links: warn
  anchors: warn
  links:
    not_found: info          # Downgrade to info (archived docs have stale links)
    unrecognized_links: info # Downgrade to info (archived docs have stale links)

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - Quickstart: guides/quickstart.md
      - Configuration: guides/configuration.md
      - Scoring a Corpus: guides/scoring-corpus.md
      - Exporting Labels: guides/exporting-labels.md
      - Running Diagnostics: guides/running-diagnostics.md
      - Troubleshooting: guides/troubleshooting.md
  - Architecture:
      - architecture/index.md
      - System Overview: architecture/system-overview.md
      - Data Flow: architecture/data-flow.md
      - LangGraph Workflow: architecture/langgraph-workflow.md
      - Resilience: architecture/resilience.md
  - Scoring:
      - scoring/index.md
      - Jury Consensus: scoring/jury-consensus.md
      - Bayesian Aggregation: scoring/bayesian-aggregation.md
      - Arbitration: scoring/arbitration.md
  - Agents:
      - agents/index.md
      - Juror: agents/juror.md
      - Judge: agents/judge.md
  - Data:
      - data/dataset-sqpsychconv-all-variants.md
      - data/dataset-daic-woz.md
      - data/paper-split-registry.md
  - Preprocessing:
      - preprocessing/index.md
      - Dialogue Views: preprocessing/dialogue-views.md
  - Reliability:
      - reliability/index.md
      - Quality Gates: reliability/quality-gates.md
      - Resilience: reliability/resilience.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - Schemas: reference/schemas.md
      - Settings: reference/settings.md
      - Thresholds: reference/thresholds.md
  - Prompts: prompts/index.md
  - Preflight Checklist: preflight-checklist/index.md
