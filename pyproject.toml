[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-check"
version = "0.1.0"
description = "Multi-agent PHQ-8 scoring for synthetic therapy dialogues"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "CLARITY-DIGITAL-TWIN" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "datasets>=3.0.0",
    "pyarrow>=18.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    # Linting & formatting
    "ruff>=0.9.2",
    # Type checking
    "mypy>=1.15.0",
    # Pre-commit
    "pre-commit>=4.1.0",
]

# ─────────────────────────────────────────────────────────────
# Ruff Configuration (linter + formatter)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["vibe_check"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ─────────────────────────────────────────────────────────────
# Mypy Configuration (strict mode)
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "datasets",
    "datasets.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# Pytest Configuration
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may use mocks)",
    "e2e: End-to-end tests (requires API keys)",
    "slow: Slow tests (>10s)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*:",
]

# ─────────────────────────────────────────────────────────────
# Coverage Configuration
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/vibe_check"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

# ─────────────────────────────────────────────────────────────
# Hatch Build Configuration (src layout)
# ─────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
# Hatchling expects package directories (not import names) for src layout.
packages = ["src/vibe_check"]
